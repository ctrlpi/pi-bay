<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Bay</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/vendor/xterm.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ctrlpi-theme') || localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #1f2328;
    background: #ffffff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar (brand · device pills · refresh · tabs · theme · menu) ── */
  #topbar {
    flex: 0 0 auto;
    min-height: 46px;
    height: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f6f8fa;
    border-bottom: 1px solid #d0d7de;
    padding: 0 16px;
    z-index: 20;
  }
  #topbar .brand {
    font-weight: 600;
    font-size: 14px;
    color: #1f2328;
    margin-right: 6px;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  #topbar .brand:hover {
    color: #0969da;
  }

  #pills {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin: 5px 0;
    min-width: 0;
  }
  #pills .no-board {
    font-size: 11px;
    color: #656d76;
    margin-right: 4px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: #24292f;
    background: #fff;
    border: 1px solid rgba(31,35,40,0.15);
    border-radius: 999px;
    padding: 3px 10px;
    cursor: pointer;
    line-height: 18px;
    white-space: nowrap;
    text-decoration: none;
    transition: all 120ms ease;
  }
  .pill:hover {
    background: #f3f4f6;
    border-color: rgba(31,35,40,0.3);
  }
  .pill.active {
    background: #ddf4ff;
    border-color: #54aeff;
    color: #0969da;
  }
  .pill .pico-icon {
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    color: #1a7f37;
    position: relative;
    top: -0.5px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .pill.active .pico-icon {
    color: #0969da;
  }
  .pill .serial {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: #57606a;
  }
  .pill.active .serial {
    color: #0969da;
  }
  .pill .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(31,35,40,0.06);
    color: #57606a;
    font-weight: 600;
  }
  .pill.active .badge {
    background: rgba(9,105,218,0.15);
    color: #0969da;
  }

  .spacer { flex: 1; min-width: 8px; }

  /* ── Tabs (Devices · Files · Terminal) ── */
  .tabs {
    display: flex;
    align-self: stretch;
    align-items: flex-end;
    gap: 4px;
    height: 100%;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .tab {
    height: 38px;
    padding: 0 14px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: #57606a;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    transition: all 120ms ease;
  }
  .tab:hover {
    color: #1f2328;
    background: rgba(31,35,40,0.05);
  }
  .tab.tab-active {
    color: #0969da;
    border-bottom-color: #0969da;
    background: transparent;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: #24292f;
    line-height: 18px;
    background: #fff;
    border: 1px solid rgba(31,35,40,0.15);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 120ms ease;
  }
  .btn:hover:not(:disabled) {
    background: #f3f4f6;
    border-color: rgba(31,35,40,0.3);
  }
  .btn:active:not(:disabled) {
    background: #eaeef2;
    transform: translateY(1px);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn.icon {
    width: 28px;
    height: 28px;
    padding: 0;
    justify-content: center;
  }
  .btn.icon svg {
    pointer-events: none;
  }
  .btn.primary {
    background: #1f883d;
    border-color: rgba(31,35,40,0.15);
    color: #fff;
  }
  .btn.primary:hover:not(:disabled) {
    background: #1a7f37;
  }
  .btn.danger, .btn.del {
    color: #cf222e;
  }
  .btn.danger:hover:not(:disabled), .btn.del:hover:not(:disabled) {
    background: #ffebe9;
    border-color: #cf222e;
    color: #cf222e;
  }

  #refresh-btn, #card-refresh-btn {
    background: transparent;
    border-color: transparent;
    flex-shrink: 0;
  }
  #refresh-btn:hover:not(:disabled), #card-refresh-btn:hover:not(:disabled) {
    background: rgba(31,35,40,0.06);
    color: #0969da;
  }
  #refresh-btn.refreshing, #card-refresh-btn.refreshing {
    background: transparent;
    border-color: transparent;
    color: #0969da;
    opacity: 1;
  }
  #refresh-btn.refreshing svg, #card-refresh-btn.refreshing svg {
    animation: refresh-spin 700ms linear infinite;
  }
  @keyframes refresh-spin { to { transform: rotate(360deg); } }

  /* ── Theme Toggle ── */
  .theme-toggle-btn {
    background: transparent;
    border: none;
    color: #57606a;
    cursor: pointer;
    padding: 4px;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    flex-shrink: 0;
    transition: all 120ms ease;
  }
  .theme-toggle-btn:hover {
    background: rgba(31,35,40,0.06);
    color: #1f2328;
  }
  .theme-toggle-btn svg {
    width: 16px;
    height: 16px;
    pointer-events: none;
  }
  .moon-icon { display: none; }
  .sun-icon { display: block; }
  .theme-toggle-btn .sun-icon { color: #eab308; }
  html.dark-mode .moon-icon { display: block; }
  html.dark-mode .sun-icon { display: none; }

  /* ── Overflow Menu ("...") ── */
  #menuwrap { position: relative; flex-shrink: 0; }
  #menu {
    display: none;
    position: absolute;
    right: 0;
    top: 32px;
    z-index: 50;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(140,149,159,0.2);
    padding: 4px;
    min-width: 200px;
  }
  #menu.open { display: block; }
  #menu button, #menu a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    font-size: 12px;
    color: #1f2328;
    background: none;
    border: 0;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: background 100ms ease;
  }
  #menu button:hover, #menu a:hover {
    background: #f3f4f6;
  }
  #menu button:disabled {
    color: #8c959f;
    cursor: not-allowed;
  }
  #menu button:disabled:hover {
    background: none;
  }
  #menu button.danger {
    color: #cf222e;
  }
  #menu button.danger:hover {
    background: #ffebe9;
  }
  #menu hr {
    border: 0;
    border-top: 1px solid #d0d7de;
    margin: 4px 0;
  }
  #menu button.menu-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #menu .menu-label-detail {
    font-size: 10px;
    color: #57606a;
  }
  #menu .menu-checkmark {
    color: #0969da;
    flex: 0 0 auto;
    transition: opacity 120ms ease;
  }
  #menu .menu-checkmark path {
    stroke-width: 1.5;
  }
  #menu .menu-state-icons {
    position: relative;
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
  }
  #menu .menu-state-icons svg {
    position: absolute;
    inset: 0;
    transition: opacity 120ms ease;
  }
  #menu .menu-off {
    color: #cf222e;
  }
  #menu-hidden-files .menu-checkmark {
    opacity: 0;
  }
  #menu-hidden-files.active .menu-checkmark {
    opacity: 1;
  }
  #mcp-toggle:not(.showing) .menu-checkmark {
    opacity: 1;
  }
  #mcp-toggle.showing .menu-checkmark {
    opacity: 0;
  }
  #mcp-toggle:not(.showing) .menu-off {
    opacity: 0;
  }
  #mcp-toggle.showing .menu-off {
    opacity: 1;
  }

  /* ── Hover Tooltip ── */
  #hover-tooltip {
    position: fixed;
    z-index: 300;
    display: none;
    pointer-events: none;
    max-width: min(320px, calc(100vw - 16px));
    padding: 5px 9px;
    color: #24292f;
    background: #fff;
    border: 1px solid rgba(31,35,40,0.15);
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(31,35,40,0.15);
    font-size: 11px;
    line-height: 15px;
    white-space: pre-line;
    word-break: break-word;
  }

  /* ── GitHub-style Markdown & README ── */
  #md, #readme-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 32px 80px;
    font-size: 16px;
    line-height: 1.5;
    color: #1f2328;
  }
  #md { display: none; }
  #readme-screen {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #fff;
  }
  #readme-content { width: 100%; }
  #md h1, #md h2, #readme-content h1, #readme-content h2 {
    padding-bottom: 0.3em;
    border-bottom: 1px solid #d0d7de;
  }
  #md h1, #readme-content h1 { font-size: 2em; margin: 0.67em 0 16px; font-weight: 600; }
  #md h2, #readme-content h2 { font-size: 1.5em; margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
  #md h3, #readme-content h3 { font-size: 1.25em; margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
  #md p, #readme-content p { margin-top: 0; margin-bottom: 16px; }
  #md a, #readme-content a { color: #0969da; text-decoration: none; }
  #md a:hover, #readme-content a:hover { text-decoration: underline; }
  #md code, #readme-content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 85%;
    padding: 0.2em 0.4em;
    background: rgba(175,184,193,0.2);
    border-radius: 6px;
  }
  #md pre, #readme-content pre {
    font-size: 85%;
    line-height: 1.45;
    background: #f6f8fa;
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 16px;
  }
  #md pre code, #readme-content pre code { background: transparent; padding: 0; }
  #md ul, #md ol, #readme-content ul, #readme-content ol { margin-top: 0; margin-bottom: 16px; padding-left: 2em; }
  #md blockquote, #readme-content blockquote {
    margin: 0 0 16px;
    padding: 0 1em;
    color: #57606a;
    border-left: 4px solid #d0d7de;
  }
  #md table, #readme-content table {
    border-collapse: collapse;
    margin-bottom: 16px;
    width: 100%;
  }
  #md table th, #md table td, #readme-content table th, #readme-content table td {
    padding: 6px 13px;
    border: 1px solid #d0d7de;
    font-size: inherit;
  }
  #md table th, #readme-content table th {
    background: #f6f8fa;
    font-weight: 600;
  }
  #md hr, #readme-content hr {
    height: 0.25em;
    padding: 0;
    margin: 24px 0;
    background-color: #d0d7de;
    border: 0;
  }
  #md img, #readme-content img {
    max-width: 100%;
    vertical-align: middle;
  }

  /* ── Views ── */
  .view {
    display: none;
    flex: 1;
    min-height: 0;
  }
  .view.active {
    display: flex;
  }

  /* ── Discovery View ── */
  #discovery {
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: #fff;
    overflow: auto;
  }
  .card {
    width: min(940px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border: 1px solid #d0d7de;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(31,35,40,0.08);
    overflow: hidden;
    background: #fff;
  }
  .cardhead {
    padding: 16px 20px;
    border-bottom: 1px solid #d0d7de;
    display: flex;
    align-items: center;
    background: #f6f8fa;
  }
  .cardhead h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: #1f2328;
  }
  .sub {
    color: #656d76;
    font-size: 12px;
    margin-top: 3px;
  }
  .scrolltable {
    overflow: auto;
    flex: 1;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #eaeef2;
    font-size: 13px;
  }
  th {
    font-size: 12px;
    font-weight: 600;
    background: #f6f8fa;
    color: #57606a;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  tbody tr {
    cursor: pointer;
  }
  tbody tr:hover {
    background: #f6f8fa;
  }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
    background: #f6f8fa;
    color: #57606a;
    font-weight: 500;
  }
  .badge.pico, .badge.esp32 {
    background: #dafbe1;
    color: #116329;
  }
  .badge.pi {
    background: #ddf4ff;
    color: #0969da;
  }
  .hw-chips {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 6px;
    vertical-align: middle;
    flex-wrap: wrap;
  }
  .hw-chip {
    font-size: 10px;
    line-height: 16px;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(31,35,40,0.06);
    color: #57606a;
    font-weight: 500;
    white-space: nowrap;
  }
  .ssh-ok {
    color: #1a7f37;
    font-weight: 700;
    font-size: 14px;
  }
  .ssh-no {
    color: #8c959f;
  }
  .ctrl-version {
    color: #1a7f37;
    font-size: 12px;
  }
  .empty {
    text-align: center;
    color: #656d76;
    padding: 48px;
  }

  /* ── Workspace ── */
  #workspace {
    flex-direction: row;
    position: relative;
    background: #fff;
  }
  #sidebar {
    width: 300px;
    min-width: 180px;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #fff;
    flex-shrink: 0;
  }
  #dragbar {
    width: 5px;
    cursor: col-resize;
    background: #d0d7de;
    flex-shrink: 0;
    transition: background 120ms ease;
  }
  #dragbar:hover, #dragbar.dragging {
    background: #0969da;
  }

  #search-wrap {
    padding: 8px 12px;
    border-bottom: 1px solid #d0d7de;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #filter {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    padding: 5px 9px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    outline: none;
    color: #1f2328;
    background: #fff;
  }
  #filter:focus {
    border-color: #0969da;
    box-shadow: 0 0 0 2px rgba(9,105,218,0.2);
  }

  #files {
    overflow-y: auto;
    flex: 1;
  }
  .file {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    border-bottom: 1px solid #f6f8fa;
    user-select: none;
  }
  .file:hover {
    background: #f6f8fa;
  }
  .file.sel {
    background: #ddf4ff;
    color: #0969da;
  }
  .file .twist {
    font-size: 8px;
    color: #8c959f;
    width: 10px;
    text-align: center;
    flex-shrink: 0;
  }
  .file svg.ficon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: #57606a;
  }
  .file.dir svg.ficon {
    color: #0969da;
  }
  .file.sel svg.ficon {
    color: #0969da;
  }
  .file .fname {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .file.dir .fname {
    font-weight: 600;
  }
  .file .fmeta {
    font-size: 10px;
    color: #8c959f;
    margin-left: auto;
    flex-shrink: 0;
    padding-right: 32px;
  }
  .file .acts {
    display: none;
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    gap: 2px;
  }
  .file:hover .acts {
    display: flex;
  }
  .file .acts button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    cursor: pointer;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    color: #57606a;
  }
  .file .acts button:hover {
    color: #0969da;
    border-color: #0969da;
  }
  .file .acts button.del:hover {
    color: #cf222e;
    border-color: #cf222e;
  }
  .file .acts button svg {
    width: 11px;
    height: 11px;
  }
  #dirlist td {
    padding: 7px 14px;
  }
  #dirlist .dname {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }
  #dirlist tr.dir .dname {
    font-weight: 600;
  }
  #dirlist svg.ficon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: #57606a;
  }
  #dirlist tr.dir svg.ficon {
    color: #0969da;
  }
  #dirlist .dmeta {
    color: #656d76;
    font-size: 12px;
    white-space: nowrap;
  }
  .file.dragging {
    opacity: 0.5;
  }
  .file.drop-target {
    background: #ddf4ff;
    box-shadow: inset 0 0 0 2px #0969da;
  }
  #content.dropping,
  #files.dropping {
    background: rgba(9,105,218,0.06);
    box-shadow: inset 0 0 0 2px #0969da;
  }
  #upload-hint {
    padding: 14px 12px;
    font-size: 11px;
    color: #8c959f;
    text-align: center;
  }

  /* ── Move-to-folder dropdown ── */
  #movewrap { position: relative; display: inline-flex; }
  #save.btn.primary { background: #0969da; border-color: #0969da; }
  #save.btn.primary:hover:not(:disabled) { background: #0860ca; }
  html.dark-mode #save.btn.primary { background: #1f6feb; border-color: #1f6feb; }
  html.dark-mode #save.btn.primary:hover:not(:disabled) { background: #388bfd; }
  #move-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 32px;
    z-index: 50;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(140,149,159,0.2);
    padding: 4px;
    min-width: 200px;
    max-height: 320px;
    overflow-y: auto;
  }
  #move-menu.open { display: block; }
  #move-menu button {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #1f2328;
    background: none;
    border: 0;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  #move-menu button:hover { background: #f3f4f6; }
  #move-menu .move-empty { padding: 6px 10px; font-size: 12px; color: #8c959f; }

  /* ── Right Content Area ── */
  #right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #fff;
  }
  #toolbar {
    height: 44px;
    border-bottom: 1px solid #d0d7de;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    background: #f6f8fa;
    flex-shrink: 0;
  }
  #filename {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #dirty {
    font-size: 10px;
    color: #bc4c00;
    background: #fff8c5;
    border: 1px solid #d4a72c;
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 600;
    display: none;
  }
  #content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 20px;
    position: relative;
  }
  #content pre {
    margin: 0;
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.55;
  }
  #editor {
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    resize: none;
    outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: #1f2328;
    background: #fff;
    tab-size: 4;
  }
  .placeholder {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #656d76;
    gap: 12px;
  }
  .placeholder svg {
    color: #8c959f;
  }
  .welcome-content {
    max-width: 520px;
    text-align: center;
    line-height: 1.7;
    font-size: 13px;
  }
  .welcome-content p { margin: 4px 0 14px; }
  .welcome-content .welcome-heading { color: #1f883d; }

  /* ── Terminal (Full-screen tab view) ── */
  #terminalBox {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    background: #fff;
    overflow: hidden;
  }
  #terminal {
    flex: 1;
    min-height: 0;
    padding: 8px 12px;
    background: #fff;
    overflow: hidden;
  }
  #workspace.terminal-mode #sidebar,
  #workspace.terminal-mode #dragbar,
  #workspace.terminal-mode #toolbar,
  #workspace.terminal-mode #content {
    display: none !important;
  }
  #workspace.terminal-mode #terminalBox {
    display: flex !important;
  }

  /* ── Animated Busy Bar ── */
  #busy {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 100%;
    z-index: 100;
    background: linear-gradient(90deg, transparent, #0969da, transparent);
    background-size: 40% 100%;
    background-repeat: no-repeat;
    display: none;
    animation: busy-slide 1s linear infinite;
  }
  #busy.on { display: block; }
  @keyframes busy-slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }

  /* ── Dialog / Modal ── */
  #app-dialog {
    width: min(440px, calc(100vw - 32px));
    margin: auto;
    border: 1px solid #d0d7de;
    border-radius: 10px;
    background: #fff;
    color: #1f2328;
    box-shadow: 0 16px 48px rgba(31,35,40,0.25);
    padding: 0;
  }
  #app-dialog::backdrop {
    background: rgba(31,35,40,0.38);
  }
  #dialog-form {
    padding: 20px;
  }
  #dialog-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  #dialog-message a { color: #0969da; }
  #dialog-message {
    color: #57606a;
    font-size: 13px;
    white-space: pre-line;
    line-height: 1.5;
  }
  #dialog-input {
    display: none;
    width: 100%;
    margin-top: 14px;
    padding: 7px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    outline: none;
    color: #1f2328;
    background: #fff;
  }
  #dialog-input.visible { display: block; }
  #dialog-input:focus {
    border-color: #0969da;
    box-shadow: 0 0 0 2px rgba(9,105,218,0.2);
  }
  #dialog-footer { margin-right: auto; color: #57606a; font-size: 12px; }
  #dialog-footer a { color: #0969da; text-decoration: none; }
  #dialog-footer a:hover { text-decoration: underline; }
  #dialog-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  #dialog-confirm.dialog-danger {
    background: #cf222e;
    border-color: #cf222e;
    color: #fff;
  }
  #dialog-confirm.dialog-danger:hover {
    background: #a40e26;
  }

  /* ── Login Modal ── */
  .modalback {
    position: fixed;
    inset: 0;
    background: rgba(31,35,40,0.38);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  .modalback.open { display: flex; }
  .modal {
    width: min(420px, calc(100% - 32px));
    background: #fff;
    border-radius: 10px;
    border: 1px solid #d0d7de;
    padding: 22px;
    box-shadow: 0 16px 48px rgba(31,35,40,0.25);
  }
  .modal h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .field {
    display: block;
    margin-top: 14px;
  }
  .field span {
    display: block;
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 5px;
    color: #24292f;
  }
  .field input[type=text], .field input[type=password] {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    outline: none;
    font-size: 13px;
    background: #fff;
    color: #1f2328;
  }
  .field input[type=text]:focus, .field input[type=password]:focus {
    border-color: #0969da;
    box-shadow: 0 0 0 2px rgba(9,105,218,0.2);
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  .choice-row {
    display: flex;
    gap: 16px;
    margin-top: 2px;
  }
  .choice-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .modal .hint {
    color: #57606a;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 12px;
  }
  .error {
    color: #cf222e;
    font-size: 12px;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2328;
    color: #fff;
    font-size: 12px;
    padding: 7px 16px;
    border-radius: 6px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    max-width: 80vw;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: #cf222e; }
  #toast.good { background: #1a7f37; }

<div id="busy"></div>

<!-- Top Bar -->
<header id="topbar">
  <a class="brand" href="/" onclick="showDevicesTab(); return false;" title="Show discovered devices">Pi Bay</a>
  <div id="pills">
    <button class="btn icon" id="refresh-btn" onclick="scan(true)" title="Scan network for devices" aria-label="Scan network">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 0 1-9.6 3.65M2.5 8a5.5 5.5 0 0 1 9.6-3.65"/><path d="M12.5 1.5v3h-3M3.5 14.5v-3h3"/></svg>
    </button>
  </div>
  <span class="spacer"></span>
  <nav class="tabs">
    <button id="showDevices" class="tab tab-active" onclick="showDevicesTab()">Devices</button>
    <button id="filesButton" class="tab" style="display:none" onclick="showFilesTab()">Files</button>
    <button id="termButton" class="tab" style="display:none" onclick="showTerminalTab()">Terminal</button>
  </nav>
  <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
    <svg class="sun-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.05 1.05M11.55 11.55l1.05 1.05M3.4 12.6l1.05-1.05M11.55 4.45l1.05-1.05"/></svg>
    <svg class="moon-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.75 5.75 0 1 1 6.4 2.5a4.6 4.6 0 0 0 7.1 7.1Z"/></svg>
  </button>
  <span id="menuwrap">
    <button class="btn icon" id="menu-btn" onclick="toggleMenu(event)" title="More actions" aria-label="More actions">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="3" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="13" cy="8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </button>
    <div id="menu">
      <button onclick="newFile()" id="menu-new-file" disabled>New file…</button>
      <button onclick="newFolder()" id="menu-new-folder" disabled>New folder…</button>
      <hr>
      <button onclick="pickUpload()" id="menu-upload" disabled>Upload files…</button>
      <button onclick="pickUploadFolder()" id="menu-upload-folder" disabled>Upload folder…</button>
      <button id="menu-install-ctrlpi" style="color: #0969da; display: none;" onclick="installCtrlPi()">Install ctrlPi API</button>
      <hr>
      <button onclick="downloadZip()" id="menu-zip" disabled>Download as ZIP</button>
      <button onclick="pickRestore()" id="menu-restore" disabled>Restore from ZIP</button>
      <hr>
      <button class="menu-toggle" id="menu-hidden-files" onclick="toggleHiddenFiles()">
        <span>Show hidden files</span>
        <svg class="menu-checkmark" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="menu-toggle showing" id="mcp-toggle" onclick="toggleMcp()" aria-pressed="false">
        <span>MCP <span class="menu-label-detail">over Streamable HTTP</span></span>
        <span class="menu-state-icons" id="mcp-status" aria-hidden="true">
          <svg class="menu-checkmark" width="14" height="14" viewBox="0 0 16 16" fill="none"><path
            d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-linecap="round"

<!-- Scripts -->
<script src="/vendor/xterm.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let devices = [];
  let chosen = null;
  let token = '';
  let home = '';
  let allFiles = [];
  let current = null;
  let selectedDir = null; // the selected folder ('' is the home folder; its listing is on the right), or null
  let term = null;
  let socket = null;
  let terminalToken = '';
  let loadedDirs = new Set();
  let expandedDirs = new Set();
  let sessionCache = new Map();
  let showHidden = false;

  const fileIcon = '<svg class="ficon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5.5Z"/><path d="M9 1.5v4h4"/></svg>';
  const folderIcon = '<svg class="ficon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h3L7.5 4H13a1.5 1.5 0 0 1 1.5 1.5V12a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12Z"/></svg>';
  const picoIcon = '<svg class="pico-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="8" height="8" rx="1.5"/><circle cx="6.25" cy="6.25" r=".6" fill="currentColor" stroke="none"/><path d="M6 12v2M10 12v2M4 6H2M4 10H2M14 6h-2M14 10h-2"/></svg>';

  function busy(on) { $('#busy').classList.toggle('on', on); }
  function toast(msg, type = '') {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'show' + (type ? ' ' + type : '');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // ── Hover Tooltip ──
  const hoverTooltipEl = $('#hover-tooltip');
  let tooltipTarget = null;
  function showHoverTooltip(target) {
    const message = target.getAttribute('data-tooltip') || target.getAttribute('title');
    if (!message) return;
    if (target.hasAttribute('title')) {
      target.setAttribute('data-tooltip', message);
      target.removeAttribute('title');
    }
    tooltipTarget = target;
    hoverTooltipEl.textContent = message;
    hoverTooltipEl.style.display = 'block';
    const targetRect = target.getBoundingClientRect();
    const tipRect = hoverTooltipEl.getBoundingClientRect();
    let left = targetRect.left + (targetRect.width - tipRect.width) / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
    let top = targetRect.bottom + 7;
    if (top + tipRect.height > window.innerHeight - 8) top = targetRect.top - tipRect.height - 7;
    hoverTooltipEl.style.left = Math.round(left) + 'px';
    hoverTooltipEl.style.top = Math.max(8, Math.round(top)) + 'px';
  }
  function hideHoverTooltip() {
    tooltipTarget = null;
    if (hoverTooltipEl) hoverTooltipEl.style.display = 'none';
  }
  document.addEventListener('mouseover', e => {
    const target = e.target.closest('[title], [data-tooltip]');
    if (target && target !== tooltipTarget) showHoverTooltip(target);
  });
  document.addEventListener('mouseout', e => {
    if (tooltipTarget && !tooltipTarget.contains(e.relatedTarget)) hideHoverTooltip();
  });
  document.addEventListener('focusin', e => {
    const target = e.target.closest('[title], [data-tooltip]');
    if (target) showHoverTooltip(target);
  });
  document.addEventListener('focusout', hideHoverTooltip);
  window.addEventListener('scroll', hideHoverTooltip, true);

  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem('ctrlpi-theme', isDark ? 'dark' : 'light');
    if (term) {
      term.options.theme = isDark
        ? { background: '#0d1117', foreground: '#e6edf3', cursor: '#58a6ff', selectionBackground: '#1f6feb44' }
        : { background: '#ffffff', foreground: '#1f2328', cursor: '#0969da', selectionBackground: '#b6e3ff' };
    }
  }

  // ── Dialog System ──
  let dialogResolver = null;
  // messageHTML and footerHTML are for fixed markup written in this page only (the About box), never for data.
  function showDialog({ title, message, messageHTML, footerHTML = '', input = false, inputValue = '', confirmText = 'OK', isDanger = false, cancel = true }) {
    return new Promise(resolve => {
      dialogResolver = resolve;
      const dlg = $('#app-dialog');
      $('#dialog-title').textContent = title || '';
      if (messageHTML) $('#dialog-message').innerHTML = messageHTML;
      else $('#dialog-message').textContent = message || '';
      $('#dialog-cancel').style.display = cancel ? '' : 'none';
      $('#dialog-footer').innerHTML = footerHTML;
      const inputEl = $('#dialog-input');
      if (input) {
        inputEl.classList.add('visible');
        inputEl.value = inputValue;
      } else {
        inputEl.classList.remove('visible');
      }
      const confirmBtn = $('#dialog-confirm');
      confirmBtn.textContent = confirmText;
      confirmBtn.classList.toggle('dialog-danger', isDanger);
      dlg.showModal();
      if (input) {
        inputEl.focus();
        inputEl.select();
      } else {
        confirmBtn.focus();
      }
    });
  }
  function closeDialog(confirmed) {
    const dlg = $('#app-dialog');
    dlg.close();
    if (dialogResolver) {
      const res = dialogResolver;
      dialogResolver = null;
      if (!confirmed) res(null);
      else {
        const inputEl = $('#dialog-input');
        res(inputEl.classList.contains('visible') ? inputEl.value : true);
      }
    }
  }
  $('#dialog-form').onsubmit = e => {
    e.preventDefault();
    closeDialog(true);
  };
  function appAlert(title, message) { return showDialog({ title, message, confirmText: 'OK' }); }
  function appConfirm(title, message, isDanger = false) { return showDialog({ title, message, confirmText: 'Confirm', isDanger }); }
  function appPrompt(title, message, defaultValue = '') { return showDialog({ title, message, input: true, inputValue: defaultValue }); }

  // ── API Helper ──
  async function json(url, opt = {}) {
    busy(true);
    try {
      opt.headers = { ...(opt.headers || {}), ...(token ? { 'X-Pi-Session': token } : {}) };
      const r = await fetch(url, opt);
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Request failed');
      return d;
    } finally {
      busy(false);
    }
  }

  function shortAddress(host) {
    const p = host.split('.');
    return p.length === 4 ? '…' + p[3] : host;
  }
  function deviceLabel(d) {
    return d.name && d.name !== '-' ? d.name : shortAddress(d.host);
  }
  function deviceType(d) {
    if (d.ssh) {
      if (d.pi) return 'Pi';
      if (d.model && !/ESP32|Pico/i.test(d.model)) return 'Pi';
      return 'Unverified';
    }
    if (d.model && /ESP32/i.test(d.model)) return 'ESP32';
    if (d.name && /ESP32/i.test(d.name)) return 'ESP32';
    if (d.ctrlpi) return 'Pico';
    if (d.pi) return 'Pi';
    return 'Unverified';
  }
  function cleanVersion(v) {
    return String(v || '').replace(/^v(?=\d)/i, '');
  }
  function modelParts(model, fallback) {
    if (!model) return { pill: fallback, suffix: '' };
    const m = String(model).match(/^(.*?)(\s+(?:Rev|with)\b.*)$/i);
    let pill = m ? m[1].trim() : String(model).trim();
    let suffix = m ? m[2].trim() : '';
    if (/\bESP32/i.test(pill) || /\bESP32/i.test(model)) {
      pill = pill.replace(/^Generic\s+/i, '').replace(/\s+module$/i, '').trim();
      pill = pill.replace(/^ESP32-?([A-Z]\d+)$/i, (_, variant) => `ESP32-${variant.toUpperCase()}`);
      pill = pill.replace(/^esp32$/i, 'ESP32');
      if (/^with\s+ESP32(?:[A-Z0-9_-]+)?$/i.test(suffix)) {
        suffix = '';
      }
    }
    return { pill, suffix };
  }
  function hardwareSpecs(d) {
    if (!d) return { ram: null, flash: null, revision: null, package: null, frequency: null };
    const model = String(d.model || '');
    const type = deviceType(d);
    let ram = d.ram || null;
    let flash = d.flash || d.sd || null;
    let revision = d.revision || null;
    let pkg = d.package || null;
    let frequency = d.frequency || null;

    if (!revision) {
      const revMatch = model.match(/\bRev\s+([0-9a-z.]+)/i);
      if (revMatch) revision = 'Rev ' + revMatch[1];
    }

    if (type === 'Pico' || /Pico/i.test(model)) {
      const isPico2 = /RP2350|Pico\s*2/i.test(model);
      if (!ram) ram = isPico2 ? '520KB RAM' : '264KB RAM';
      if (!flash) flash = isPico2 ? '4MB Flash' : '2MB Flash';
      if (!frequency) frequency = isPico2 ? '150MHz' : '133MHz';
      if (!pkg) pkg = isPico2 ? 'RP2350' : 'RP2040';
    } else if (type === 'ESP32' || /ESP32/i.test(model)) {
      if (/ESP32-?S3/i.test(model)) {
        if (!ram) ram = '512KB RAM';
        if (!flash) flash = '8MB Flash';
        if (!frequency) frequency = '240MHz';
        if (!pkg) pkg = 'Xtensa LX7';
      } else if (/ESP32-?C3/i.test(model)) {
        if (!ram) ram = '400KB RAM';
        if (!flash) flash = '4MB Flash';
        if (!frequency) frequency = '160MHz';
        if (!pkg) pkg = 'RISC-V';
      } else if (/ESP32-?S2/i.test(model)) {
        if (!ram) ram = '320KB RAM';
        if (!flash) flash = '4MB Flash';
        if (!frequency) frequency = '240MHz';
        if (!pkg) pkg = 'Xtensa LX7';
      } else {
        if (!ram) ram = '520KB RAM';
        if (!flash) flash = '4MB Flash';
        if (!frequency) frequency = '240MHz';
        if (!pkg) pkg = 'Xtensa LX6';
      }
    } else if (type === 'Pi' || d.pi) {
      if (!ram) {
        if (/Zero\s*2\s*W/i.test(model)) ram = '512MB RAM';
        else if (/Zero/i.test(model)) ram = '512MB RAM';
        else if (/Model\s*A\b|1\s*A\b/i.test(model)) ram = '256MB RAM';
        else if (/3\s*A\+/i.test(model)) ram = '512MB RAM';
        else if (/3\s*B\b|3\s*B\+/i.test(model)) ram = '1GB RAM';
        else if (/2\s*B\b/i.test(model)) ram = '1GB RAM';
      }
      if (!frequency) {
        if (/Pi\s*5/i.test(model)) frequency = '2.4GHz';
        else if (/Pi\s*4/i.test(model)) frequency = '1.5GHz';
        else if (/3\s*B\+/i.test(model)) frequency = '1.4GHz';
        else if (/3\s*B\b/i.test(model)) frequency = '1.2GHz';
        else if (/Zero\s*2/i.test(model)) frequency = '1.0GHz';
        else if (/Zero/i.test(model)) frequency = '1.0GHz';
      }
    }

    if (ram && !/RAM/i.test(String(ram))) ram = String(ram).trim() + ' RAM';
    if (flash && !/Flash|SD/i.test(String(flash))) flash = String(flash).trim() + (type === 'Pi' || d.pi ? ' SD' : ' Flash');
    if (frequency && !/Hz$/i.test(String(frequency))) frequency = String(frequency).trim() + 'MHz';

    return { ram, flash, revision, package: pkg, frequency };
  }
  function deviceDetails(d) {
    const hw = hardwareSpecs(d);
    return [
      'Name: ' + deviceLabel(d),
      'Device: ' + (d.model || deviceType(d)),
      hw.ram ? 'RAM: ' + hw.ram : null,
      hw.flash ? (deviceType(d) === 'Pi' || d.pi ? 'SD: ' : 'Flash: ') + hw.flash : null,
      hw.revision ? 'Revision: ' + hw.revision : null,
      hw.package ? 'Package: ' + hw.package : null,
      hw.frequency ? 'Frequency: ' + hw.frequency : null,
      d.os ? 'OS: ' + d.os : null,
      'IP: ' + d.host + (d.ssh && d.port !== 22 ? ':' + d.port : ''),
      'MAC: ' + (d.mac || 'not available'),
      'SSH: ' + (d.ssh ? 'available' : 'no'),
      'ctrlPi: ' + (d.ctrlpi ? 'running' : 'no'),
      d.version ? 'Version: ' + cleanVersion(d.version) : null
    ].filter(Boolean).join('\n');
  }

  // ── Render Devices & Pills ──
  function renderDevices() {
    const rows = $('#rows');
    const cols = 6;
    const refreshBtn = $('#refresh-btn');
    if (!devices.length) {
      rows.innerHTML = `<tr><td colspan="${cols}" class="empty">${refreshBtn?.classList.contains('refreshing') ? 'Scanning…' : 'No SSH or ctrlPi devices found'}</td></tr>`;
      $('#pills').innerHTML = '<span class="no-board">no board connected</span>';
      if (refreshBtn) $('#pills').appendChild(refreshBtn);
      return;
    }

    rows.innerHTML = devices.map((d, i) => {
      const type = deviceType(d);
      const badge = type === 'Pi' ? 'pi' : type === 'Pico' ? 'pico' : type === 'ESP32' ? 'esp32' : '';
      const parts = modelParts(d.model, type);
      const hw = hardwareSpecs(d);
      const chips = [
        hw.ram ? `<span class="hw-chip">${esc(hw.ram)}</span>` : '',
        hw.flash ? `<span class="hw-chip">${esc(hw.flash)}</span>` : '',
        hw.revision ? `<span class="hw-chip">${esc(hw.revision)}</span>` : '',
        hw.package ? `<span class="hw-chip">${esc(hw.package)}</span>` : '',
        hw.frequency ? `<span class="hw-chip">${esc(hw.frequency)}</span>` : ''
      ].filter(Boolean).join('');
      return `<tr data-i="${i}" style="${d.ssh ? '' : 'cursor:default'}">
        <td>${esc(d.name)}</td>
        <td><span class="badge ${badge}">${esc(parts.pill)}</span>${chips ? ' <span class="hw-chips">' + chips + '</span>' : ''}</td>
        <td>${esc(d.host)}</td>
        <td>${esc(d.mac || '-')}</td>
        <td>${d.ssh ? '<span class="ssh-ok" title="SSH available">✓</span>' : '<span class="ssh-no">-</span>'}</td>
        <td>${d.ctrlpi ? (d.version ? `<span class="ctrl-version">${esc(cleanVersion(d.version))}</span>` : '<span class="ssh-ok" title="ctrlPi /hello answered">✓</span>') : '<span class="ssh-no">-</span>'}</td>
      </tr>`;
    }).join('');

    const pis = devices.filter(d => deviceType(d) === 'Pi' && d.ssh);
    if (!pis.length) {
      $('#pills').innerHTML = '<span class="no-board">no Pis connected</span>';
    } else {
      $('#pills').innerHTML = pis.map(d => {
        const isActive = chosen && chosen.host === d.host;
        return `<button class="pill ${isActive ? 'active' : ''}" data-host="${esc(d.host)}" title="${esc(deviceDetails(d))}">
          ${picoIcon}
          <span>${esc(deviceLabel(d))}</span>
        </button>`;
      }).join('');
    }
    if (refreshBtn) $('#pills').appendChild(refreshBtn);
  }

  async function scan(force = false) {
    exitReadme();
    const refreshBtn = $('#refresh-btn');
    const cardBtn = $('#card-refresh-btn');
    if (refreshBtn.classList.contains('refreshing')) return;
    refreshBtn.classList.add('refreshing');
    cardBtn.classList.add('refreshing');
    refreshBtn.disabled = cardBtn.disabled = true;
    $('#scanText').textContent = 'Scanning the local network for SSH and ctrlPi devices…';
    devices = [];
    renderDevices();
    busy(true);
    try {
      const response = await fetch('/api/devices/stream' + (force ? '?refresh=1' : ''));
      if (!response.ok || !response.body) throw new Error('Scan request failed');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let pending = '';
      while (true) {
        const { value, done } = await reader.read();
        pending += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = pending.split('\n');
        pending = lines.pop() || '';
        for (const line of lines) {
          if (!line) continue;
          const msg = JSON.parse(line);
          if (msg.error) throw new Error(msg.error);
          if (msg.device) {
            const i = devices.findIndex(d => d.host === msg.device.host);
            if (i < 0) devices.push(msg.device);
            else devices[i] = { ...devices[i], ...msg.device };
            devices.sort((a, b) => deviceLabel(a).localeCompare(deviceLabel(b), undefined, { sensitivity: 'base', numeric: true }));
            renderDevices();
            $('#scanText').textContent = `Scanning… found ${devices.length} device${devices.length === 1 ? '' : 's'}`;
          }
          if (msg.done) {
            $('#scanText').textContent = `Found ${devices.length} device${devices.length === 1 ? '' : 's'}; select one with SSH to connect.`;
            if (msg.mcpEnabled !== undefined) setMcpEnabled(msg.mcpEnabled);
          }
        }
        if (done) break;
      }
    } catch (e) {
      $('#rows').innerHTML = `<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`;
      $('#scanText').textContent = 'Scan failed';
    } finally {
      refreshBtn.classList.remove('refreshing');
      cardBtn.classList.remove('refreshing');
      refreshBtn.disabled = cardBtn.disabled = false;
      busy(false);
      if (!devices.length && $('#scanText').textContent !== 'Scan failed') renderDevices();
    }
  }

  // ── Device Connection & Sessions ──
  function cacheKey(d) { return d.host; }
  function openLogin(d, message = '') {
    chosen = d;
    $('#loginHost').textContent = `${d.name} · ${d.host}:${d.port}`;
    $('#username').value = d.username || 'pi';
    $('#password').value = '';
    $('#remember').checked = !!d.saved;
    $('#loginError').textContent = message;
    $('#loginBack').classList.add('open');
    setTimeout(() => $('#password').focus(), 50);
  }
  function closeLoginModal() {
    $('#loginBack').classList.remove('open');
  }

  function askLogin(d) {
    exitReadme();
    const cached = sessionCache.get(cacheKey(d));
    if (cached) {
      activateDevice(d, cached, true).catch(() => {
        sessionCache.delete(cacheKey(d));
        token = '';
        openLogin(d, 'The previous session expired. Please connect again.');
      });
      return;
    }
    openLogin(d);
  }

  async function activateDevice(device, session, validateSession = false) {
    const wasTerminal = $('#termButton')?.classList.contains('tab-active') || $('#workspace')?.classList.contains('terminal-mode');
    chosen = device;
    if (session.model) {
      device.model = session.model;
    }
    token = session.token;
    home = session.home;
    allFiles = [];
    loadedDirs = new Set();
    expandedDirs = new Set();
    clearViewer();
    if (socket) {
      socket.onclose = null;
      socket.onerror = null;
      socket.close();
      socket = null;
    }
    terminalToken = '';
    closeLoginModal();

    $('#filesButton').style.display = '';
    $('#termButton').style.display = '';
    setMenuDeviceEnabled(true);

    renderDevices();
    if (wasTerminal) {
      showTerminalTab();
    } else {
      showFilesTab();
    }

    try {
      await loadFiles();
      // A home folder with a single folder opens it and selects its first entry; otherwise the home folder is selected.
      const dirs = allFiles.filter(f => f.isDir && !f.path.includes('/'));
      if (dirs.length === 1) {
        await selectFolder(dirs[0].path);
        const first = visibleFiles().find(f => parentPath(f.path) === dirs[0].path);
        if (first && first.isDir) await selectFolder(first.path, false, false);
        else if (first) {
          await openFile(first);
          if (wasTerminal) showTerminalTab();
        }
      } else {
        await selectFolder('');
      }
      toast(`Connected to ${deviceLabel(device)}`, 'good');
    } catch (e) {
      if (validateSession) throw e;
      $('#files').innerHTML = `<div class="empty">Could not load files<br>${esc(e.message)}</div>`;
    }
  }

  async function handleLoginSubmit(e) {
    e.preventDefault();
    const btn = $('#connectButton');
    btn.disabled = true;
    btn.textContent = 'Connecting…';
    $('#loginError').textContent = '';
    try {
      const d = await json('/api/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          host: chosen.host,
          port: chosen.port,
          mac: chosen.mac,
          username: $('#username').value,
          password: $('#password').value,
          savePassword: $('#remember').checked
        })
      });
      sessionCache.set(cacheKey(chosen), d);
      await activateDevice(chosen, d);
      if (d.credentialWarning) console.warn(d.credentialWarning);
    } catch (x) {
      $('#loginError').textContent = x.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Connect';
    }
  }

  function setMenuDeviceEnabled(enabled) {
    ['menu-upload', 'menu-upload-folder', 'menu-new-file', 'menu-new-folder', 'menu-zip', 'menu-restore', 'menu-disconnect', 'menu-usb-power', 'menu-reboot'].forEach(id => {
      const el = $('#' + id);
      if (el) el.disabled = !enabled;
    });
    const ctrlPiBtn = $('#menu-install-ctrlpi');
    if (ctrlPiBtn) ctrlPiBtn.style.display = enabled ? 'block' : 'none';
  }

  // ── Tab Navigation ──
  function exitReadme() {
    const screen = $('#readme-screen');
    if (!screen || screen.style.display === 'none') return;
    screen.style.display = 'none';
    updateTitle();
  }

  // The browser tab names the open file or the selected folder (the home folder by its own name).
  function updateTitle() {
    if ($('#readme-screen').style.display === 'block') return;
    const p = current ? current.path : selectedDir;
    document.title = p === null ? 'Pi Bay' : 'Pi Bay - ' + (p || home).split('/').pop();
  }

  function setActiveTab(id) {
    ['showDevices', 'filesButton', 'termButton'].forEach(x => $('#' + x)?.classList.toggle('tab-active', x === id));
  }
  function showDevicesTab() {
    exitReadme();
    $('.view.active')?.classList.remove('active');
    $('#discovery').classList.add('active');
    setActiveTab('showDevices');
  }
  function showFilesTab() {
    exitReadme();
    $('.view.active')?.classList.remove('active');
    $('#workspace').classList.add('active');
    $('#workspace').classList.remove('terminal-mode');
    setActiveTab('filesButton');
  }
  function showTerminalTab() {
    exitReadme();
    $('.view.active')?.classList.remove('active');
    $('#workspace').classList.add('active');
    $('#workspace').classList.add('terminal-mode');
    setActiveTab('termButton');

  // ── File Management ──
  const shq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
  const shFileArg = s => /^[a-zA-Z0-9_.-]+$/.test(s) ? s : shq(s);
  const TOOLBAR_BUTTONS = ['run', 'format-json', 'movewrap', 'download', 'edit', 'save', 'cancel', 'rename', 'remove'];
  const RUNNERS = { py: 'python3', sh: './', bash: './', js: 'node' };
  const ROW_ICONS = {
    del: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4"/><path d="M3.75 4l.7 9a1.5 1.5 0 0 0 1.5 1.5h4.1a1.5 1.5 0 0 0 1.5-1.5l.7-9"/><path d="M6.5 7v4.5M9.5 7v4.5"/></svg>'
  };

  function emptyViewerHTML() {
    return `<div class="placeholder">
        <svg width="42" height="42" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5.5Z"/><path d="M9 1.5v4h4"/></svg>
        <span>Select a file from the home directory</span>
        <div class="welcome-content">
          <p><strong class="welcome-heading">Your next project starts here.</strong></p>
          <p>Drop files or folders onto the list to upload them, drag a file onto a folder to move it,<br>or open the Terminal tab for a shell on the Pi.</p>
          <button class="btn primary" onclick="showReadme()">Getting started</button>
        </div>
      </div><textarea id="editor" spellcheck="false"></textarea>`;
  }

  function clearViewer() {
    current = null;
    selectedDir = null;
    updateTitle();
    $('#content').innerHTML = emptyViewerHTML();
    TOOLBAR_BUTTONS.forEach(x => $('#' + x).style.display = 'none');
    $('#filename').textContent = '';
    $('#dirty').style.display = 'none';
    closeMoveMenu();
  }

  async function loadFiles(path = '') {
    const d = await json('/api/files?path=' + encodeURIComponent(path) + (showHidden ? '&showHidden=1' : ''));
    allFiles = allFiles.filter(f => parentPath(f.path) !== path).concat(d.files);
    loadedDirs.add(path);
    renderFiles();
  }

  // Reload the given folders (and the root) so the tree reflects a change; unloaded folders are skipped.
  async function refreshDirs(dirs) {
    const list = [...new Set([''].concat(dirs))].filter(d => d === '' || loadedDirs.has(d)).sort((a, b) => a.length - b.length);
    for (const d of list) {
      try { await loadFiles(d); } catch (e) { toast('Could not refresh ' + (d || home) + ': ' + e.message, 'bad'); }
    }
  }

  function parentPath(p) {
    const i = p.lastIndexOf('/');
    return i < 0 ? '' : p.slice(0, i);
  }

  function formatSize(bytes) {
    if (bytes === undefined || bytes === null) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function visibleFiles() {
    const out = [];
    function add(parent, depth) {
      allFiles.filter(f => parentPath(f.path) === parent)
        .sort((a, b) => Number(b.isDir) - Number(a.isDir) || a.name.localeCompare(b.name))
        .forEach(f => {
          out.push({ ...f, depth });
          if (f.isDir && expandedDirs.has(f.path)) add(f.path, depth + 1);
        });
    }
    add('', 0);
    return out;
  }

  function renderFiles() {
    const q = $('#filter').value.toLowerCase();
    const rows = q ? allFiles.filter(f => f.path.toLowerCase().includes(q)).map(f => ({ ...f, depth: f.path.split('/').length - 1 })) : visibleFiles();
    $('#files').innerHTML = rows.map(f => {
      const isSel = current ? current.path === f.path : selectedDir === f.path;
      const isExpanded = expandedDirs.has(f.path);
      const twist = f.isDir ? `<span class="twist">${isExpanded ? '▼' : '▶'}</span>` : `<span class="twist"></span>`;
      return `<div class="file ${f.isDir ? 'dir' : ''} ${isSel ? 'sel' : ''}" data-path="${esc(f.path)}" data-dir="${f.isDir ? '1' : ''}" draggable="true" style="padding-left: ${10 + f.depth * 14}px">
        ${twist}
        ${f.isDir ? folderIcon : fileIcon}
        <span class="fname">${esc(f.name || f.path.split('/').pop())}</span>
        <span class="fmeta">${f.isDir ? '' : formatSize(f.size)}</span>
        <span class="acts"><button class="del" data-act="delete" title="Delete ${f.isDir ? 'folder' : 'file'}">${ROW_ICONS.del}</button></span>
      </div>`;
    }).join('') + (token && !q ? `<div id="upload-hint">Drop files or folders here to upload them to ${esc(home)}</div>` : '');
    if (selectedDir !== null && !current) renderFolderView();
  }

  // The folder that new files, new folders and uploads go into: the selected folder, else the open file's folder.
  function targetDir() {
    return selectedDir !== null ? selectedDir : current ? parentPath(current.path) : '';
  }

  // Select a folder: its files on the right, rename and delete in the toolbar (not for the home folder).
  // toggle collapses an expanded folder; expand = false lists it without expanding it in the tree.
  async function selectFolder(p, toggle = false, expand = true) {
    closeMoveMenu();
    current = null;
    selectedDir = p;
    TOOLBAR_BUTTONS.forEach(x => $('#' + x).style.display = p && (x === 'rename' || x === 'remove') ? '' : 'none');
    $('#dirty').style.display = 'none';
    if (toggle && expandedDirs.has(p)) {
      expandedDirs.delete(p);
    } else {
      expandTo(expand ? p : parentPath(p));
      if (!loadedDirs.has(p)) {
        $('#content').innerHTML = '<div class="placeholder">Loading folder…</div><textarea id="editor" spellcheck="false"></textarea>';
        try { await loadFiles(p); } catch (e) { toast('Could not open folder: ' + e.message, 'bad'); }
      }
    }
    renderFiles();
  }

  function formatDate(mtime) {
    return mtime ? new Date(mtime * 1000).toLocaleString() : '';
  }

  function renderFolderView() {
    $('#filename').textContent = home + (selectedDir ? '/' + selectedDir : '');
    updateTitle();
    const rows = allFiles.filter(f => parentPath(f.path) === selectedDir)
      .sort((a, b) => Number(b.isDir) - Number(a.isDir) || a.name.localeCompare(b.name));
    $('#content').innerHTML = (rows.length
      ? `<table id="dirlist"><thead><tr><th>Name</th><th>Size</th><th>Modified</th></tr></thead><tbody>` +
        rows.map(f => `<tr class="${f.isDir ? 'dir' : ''}" data-path="${esc(f.path)}" data-dir="${f.isDir ? '1' : ''}">
          <td><span class="dname">${f.isDir ? folderIcon : fileIcon}<span>${esc(f.name)}</span></span></td>
          <td class="dmeta">${f.isDir ? '' : formatSize(f.size)}</td>
          <td class="dmeta">${formatDate(f.mtime)}</td>
        </tr>`).join('') + '</tbody></table>'
      : '<div class="placeholder">Empty folder</div>') + '<textarea id="editor" spellcheck="false"></textarea>';
  }

  $('#content').addEventListener('click', e => {
    const row = e.target.closest('#dirlist tr[data-path]');
    if (!row) return;
    const f = allFiles.find(x => x.path === row.dataset.path);
    if (!f) return;
    if (f.isDir) selectFolder(f.path);
    else openFile(f);
  });

  $('#filter').oninput = renderFiles;

  $('#files').onclick = async e => {
    const el = e.target.closest('[data-path]');
    if (!el) return;
    const act = e.target.closest('[data-act]');
    const p = el.dataset.path;
    const isDir = el.dataset.dir === '1';
    if (act) {
      e.stopPropagation();
      if (act.dataset.act === 'delete') deletePath(p, isDir);
      return;
    }
    const f = allFiles.find(x => x.path === p);
    if (!f) return;
    if (f.isDir) {
      await selectFolder(f.path, true);
    } else {
      openFile(f);
    }
  };

  function runnerFor(p) {
    const m = /\.([a-z]+)$/i.exec(p || '');
    return m ? RUNNERS[m[1].toLowerCase()] || null : null;
  }

  async function openFile(f) {
    showFilesTab();
    closeMoveMenu();
    selectedDir = null;
    $('#filename').textContent = home + '/' + f.path;
    $('#dirty').style.display = 'none';
    $('#content').innerHTML = '<div class="placeholder">Loading file…</div><textarea id="editor" spellcheck="false"></textarea>';
    try {
      const d = await json('/api/file?path=' + encodeURIComponent(f.path));
      current = { ...f, ...d };
      updateTitle();
      ['download', 'rename', 'remove', 'movewrap'].forEach(x => $('#' + x).style.display = '');
      $('#edit').style.display = d.binary ? 'none' : '';
      $('#run').style.display = !d.binary && runnerFor(f.path) ? '' : 'none';
      $('#save').style.display = $('#cancel').style.display = $('#format-json').style.display = 'none';
      if (d.binary) {
        $('#content').innerHTML = `<div class="placeholder">Binary file · ${formatSize(d.size)}</div><textarea id="editor" spellcheck="false"></textarea>`;
      } else if (/\.md$/i.test(f.path)) {
        $('#content').innerHTML = `<div id="md" style="display:block">${renderMarkdown(d.text || '')}</div><textarea id="editor" spellcheck="false"></textarea>`;
      } else {
        $('#content').innerHTML = `<pre>${esc(d.text || '')}</pre><textarea id="editor" spellcheck="false"></textarea>`;
      }
      renderFiles();
    } catch (e) {
      $('#content').innerHTML = `<div class="placeholder" style="color:#cf222e">Could not open file: ${esc(e.message)}</div><textarea id="editor" spellcheck="false"></textarea>`;
    }
  }

  function startEdit() {
    closeMoveMenu();
    $('#content').innerHTML = `<textarea id="editor" spellcheck="false"></textarea>`;
    const e = $('#editor');
    e.style.display = 'block';
    e.value = current.text || '';
    e.focus();
    // Only Format JSON (for .json), Cancel and Save while editing.
    ['edit', 'run', 'movewrap', 'download', 'rename', 'remove'].forEach(x => $('#' + x).style.display = 'none');
    $('#save').style.display = $('#cancel').style.display = '';
    $('#format-json').style.display = /\.json$/i.test(current.path) ? '' : 'none';
    $('#dirty').style.display = '';
  }

  function cancelEdit() {
    $('#dirty').style.display = 'none';
    openFile(current);
  }

  function formatJSON() {
    const editor = $('#editor');
    if (!current || !editor || !/\.json$/i.test(current.path)) return;
    try {
      editor.value = JSON.stringify(JSON.parse(editor.value), null, 3) + '\n';
      toast('JSON formatted with 3-space indentation', 'good');
    } catch (e) {
      toast('Invalid JSON: ' + e.message, 'bad');
    }
  }

  async function saveEdit() {
    const text = $('#editor').value;
    busy(true);
    try {
      await json('/api/file?path=' + encodeURIComponent(current.path), { method: 'PUT', body: text });
      current.text = text;
      toast('File saved', 'good');
      await openFile(current);
      await loadFiles(parentPath(current.path));
    } catch (e) {
      toast('Save failed: ' + e.message, 'bad');
    } finally {
      busy(false);
    }
  }

  function runCurrentFile() {
    const runner = current && runnerFor(current.path);
    if (!runner) return;
    const dir = parentPath(current.path);
    const fileName = current.path.split('/').pop();
    const cmd = runner === './' ? `./${shFileArg(fileName)}` : `${runner} ${shFileArg(fileName)}`;
    sendToTerminal(`cd ${shq(dir ? home + '/' + dir : home)} && ${cmd}\n`);
  }

  function downloadPath(p) {
    location.href = '/api/file?download=1&session=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(p);
  }
  function downloadCurrentFile() {
    if (current) downloadPath(current.path);
  }

  // Rename or move a file or folder, then fix up the cached tree and the open file.
  async function movePathTo(from, to, isDir) {
    to = to.replace(/^\/+|\/+$/g, '');
    if (!to || to === from) return false;
    if (isDir && to.startsWith(from + '/')) { toast('A folder cannot be moved into itself', 'bad'); return false; }
    if (allFiles.some(f => f.path === to)) { toast(`"${to}" already exists`, 'bad'); return false; }
    busy(true);
    try {
      await json('/api/rename?path=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to), { method: 'POST' });
    } catch (e) {
      busy(false);
      toast('Move failed: ' + e.message, 'bad');
      return false;
    }
    const under = x => x === from || x.startsWith(from + '/');
    const openPath = current && under(current.path) ? to + current.path.slice(from.length) : null;
    if (selectedDir && under(selectedDir)) selectedDir = to + selectedDir.slice(from.length);
    const wasExpanded = expandedDirs.has(from);

    if (wasExpanded) { expandedDirs.add(to); loadedDirs.add(to); }
    await refreshDirs([parentPath(from), parentPath(to), wasExpanded ? to : '']);

  // Upload [{ file, rel }] into dir (relative to home); the server creates any missing folders.
  async function uploadEntries(list, dir = '') {
    if (!token || !list.length) return;
    const target = rel => dir ? dir + '/' + rel : rel;
    const clashes = list.filter(x => allFiles.some(f => !f.isDir && f.path === target(x.rel)));
    if (clashes.length && !await appConfirm('Overwrite files?', clashes.length === 1
      ? `"${target(clashes[0].rel)}" already exists.`
      : `${clashes.length} files already exist, for example "${target(clashes[0].rel)}".`, true)) return;
    let done = 0;
    busy(true);
    try {
      for (const x of list) {
        await json('/api/file?path=' + encodeURIComponent(target(x.rel)), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: x.file
        });
        done++;
      }
      toast(`Uploaded ${done} file${done === 1 ? '' : 's'}${dir ? ' to ' + dir : ''}`, 'good');
    } catch (err) {
      toast(`Upload failed after ${done} of ${list.length} file${list.length === 1 ? '' : 's'}: ${err.message}`, 'bad');
    } finally {
      expandTo(dir);
      const dirs = [];
      for (let d = dir; d; d = parentPath(d)) { dirs.push(d); loadedDirs.add(d); }
      loadedDirs.forEach(d => { if (!dir || d.startsWith(dir + '/')) dirs.push(d); });
      await refreshDirs(dirs);
      busy(false);
    }
  }

  function dropTargetDir(e) {

  // Collect dropped files, walking dropped folders so their structure is kept.
  async function droppedEntries(dt) {
    const roots = Array.from(dt.items || []).filter(i => i.kind === 'file').map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!roots.length) return Array.from(dt.files || []).map(file => ({ file, rel: file.name }));
    const out = [];
    async function walk(entry, prefix) {
      if (entry.isFile) {
        out.push({ file: await new Promise((resolve, reject) => entry.file(resolve, reject)), rel: prefix + entry.name });
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        let batch;
        do {
          batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
          for (const child of batch) await walk(child, prefix + entry.name + '/');
        } while (batch.length);
      }
    }
    for (const entry of roots) await walk(entry, '');
    return out;
  }

  let draggedPath = null;
  let draggedIsDir = false;
  const filesEl = $('#files');
  filesEl.addEventListener('dragstart', e => {
    const row = e.target.closest('.file');
    if (!row || !token) return;
    draggedPath = row.dataset.path;
    draggedIsDir = row.dataset.dir === '1';
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData('text/plain', draggedPath);
    if (!draggedIsDir) {
      // Dragging a file out of the window downloads it (Chromium browsers).
      const name = draggedPath.split('/').pop().replace(/[\r\n:]/g, '_');
      const url = new URL('/api/file?download=1&session=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(draggedPath), location.href).href;
      e.dataTransfer.setData('DownloadURL', 'application/octet-stream:' + name + ':' + url);
    }
  });
  filesEl.addEventListener('dragend', () => {
    document.querySelectorAll('#files .dragging').forEach(el => el.classList.remove('dragging'));
    draggedPath = null;
    clearDropHighlight();
  });
  ['dragenter', 'dragover'].forEach(ev => filesEl.addEventListener(ev, e => {
    if (!token || (!draggedPath && !isFileDrag(e))) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = draggedPath ? 'move' : 'copy';
    highlightDrop(dropTargetDir(e));
  }));
  filesEl.addEventListener('dragleave', e => {
    if (!filesEl.contains(e.relatedTarget)) clearDropHighlight();
  });
  filesEl.addEventListener('drop', async e => {
    if (!token) return;
    e.preventDefault();
    clearDropHighlight();
    const dir = dropTargetDir(e);
    if (draggedPath) {
      const from = draggedPath;
      const isDir = draggedIsDir;
      draggedPath = null;
      const base = from.split('/').pop();
      await movePathTo(from, dir ? dir + '/' + base : base, isDir);
      return;
    }
    if (isFileDrag(e)) uploadEntries(await droppedEntries(e.dataTransfer), dir);
  });
  // Files dropped on the right side: on the selected folder's listing they upload into that folder,
  // on an open text file the first one replaces its content in the editor (saved only with Save).
  const contentEl = $('#content');
  const folderDrop = () => selectedDir !== null && !current;
  const fileDrop = () => current && !current.binary;
  const contentDrop = e => token && !draggedPath && isFileDrag(e) && (folderDrop() || fileDrop());
  ['dragenter', 'dragover'].forEach(ev => contentEl.addEventListener(ev, e => {
    if (!contentDrop(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    contentEl.classList.add('dropping');
  }));
  contentEl.addEventListener('dragleave', e => {
    if (!contentEl.contains(e.relatedTarget)) contentEl.classList.remove('dropping');
  });
  contentEl.addEventListener('drop', async e => {
    contentEl.classList.remove('dropping');
    if (!contentDrop(e)) return;
    e.preventDefault();
    if (folderDrop()) uploadEntries(await droppedEntries(e.dataTransfer), selectedDir);
    else replaceWithDroppedFile(e.dataTransfer.files[0]);
  });
  async function replaceWithDroppedFile(file) {

      if (socket && socket.readyState === 1) socket.send(JSON.stringify({ type: 'data', data: cmd }));

    if (socket && socket.readyState === 1 && terminalToken === token) {

    '[ -n "$hubs" ] || { echo "No USB hub with power switching found"; exit 1; }; ' +
    'for h in $(echo "$hubs" | sort -r); do sudo uhubctl -l "$h" -a off >/dev/null; done; sleep 3; ' +
