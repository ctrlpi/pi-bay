  // ── Markdown Parser (GitHub Primer subset) ──
  function markdownInline(text) {
    var tokens = [];
    function token(html) { tokens.push(html); return '\uE000' + (tokens.length - 1) + '\uE001'; }
    function safeHref(href) {
      return /^(https?:|mailto:|#|\/|\.\/|\.\.\/)/i.test(href) || /^[a-z0-9][a-z0-9._~\/-]*$/i.test(href);
    }
    text = text.replace(/`([^`]+)`/g, function (_m, code) {
      return token('<code>' + esc(code) + '</code>');
    });
    text = text.replace(/\[!\[([^\]]*)\]\((https:\/\/[^)]+)\)\]\(([^)]+)\)/gi, function (_m, alt, src, href) {
      var clean = href.trim();
      if (!safeHref(clean)) return alt;
      return token('<a href="' + esc(clean) + '" target="_blank" rel="noopener noreferrer"><img src="' +
        esc(src.trim()) + '" alt="' + esc(alt) + '"></a>');
    });
    text = text.replace(/!\[([^\]]*)\]\((https:\/\/[^)]+)\)/gi, function (_m, alt, src) {
      return token('<img src="' + esc(src.trim()) + '" alt="' + esc(alt) + '">');
    });
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_m, label, href) {
      var clean = href.trim();
      if (!safeHref(clean)) return label;
      return token('<a href="' + esc(clean) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>');
    });
    text = esc(text)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>');
    // A token can hold another (code inside a link's label), so restore them recursively.
    function restore(html) {
      return html.replace(/\uE000(\d+)\uE001/g, function (_m, i) { return restore(tokens[Number(i)]); });
    }
    return restore(text);
  }

  function safeMarkdownTable(source) {
    var parsed = new DOMParser().parseFromString(source, 'text/html');
    var table = parsed.body.firstElementChild;
    if (!table || table.tagName !== 'TABLE' || parsed.body.children.length !== 1) return esc(source);
    var allowed = ['TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'CODE'];
    var elements = [table].concat(Array.from(table.querySelectorAll('*')));
    for (var i = 0; i < elements.length; i++) {
      var element = elements[i];
      if (allowed.indexOf(element.tagName) === -1) return esc(source);
      var width = element.getAttribute('width');
      while (element.attributes.length) element.removeAttribute(element.attributes[0].name);
      if (width && /^(?:100|[1-9]?\d)%$/.test(width)) element.setAttribute('width', width);
    }
    return table.outerHTML;
  }

  function renderMarkdown(text) {
    var lines = text.replace(/\r\n?/g, '\n').split('\n');
    var html = [], paragraph = [], list = null, fenced = false, fence = [];
    function tableCells(line) {
      var trimmed = line.trim().replace(/^\|/, '').replace(/\|$/, '');
      return trimmed.split('|').map(function (cell) { return cell.trim(); });
    }
    function flushParagraph() {
      if (paragraph.length) html.push('<p>' + markdownInline(paragraph.join(' ')) + '</p>');
      paragraph = [];
    }
    function closeList() {
      if (list) html.push('</' + list + '>');
      list = null;
    }
    for (var lineIndex = 0; lineIndex < lines.length; lineIndex++) {
      var line = lines[lineIndex];
      if (/^```/.test(line)) {
        flushParagraph(); closeList();
        if (fenced) { html.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>'); fence = []; }
        fenced = !fenced;
        continue;
      }
      if (fenced) { fence.push(line); continue; }
      var m;
      if (/^<table(?:\s|>)/i.test(line.trim())) {
        flushParagraph(); closeList();
        var tableSource = [line];
        while (!/<\/table>\s*$/i.test(tableSource[tableSource.length - 1]) && lineIndex + 1 < lines.length) {
          tableSource.push(lines[++lineIndex]);
        }
        html.push(safeMarkdownTable(tableSource.join('\n')));
        continue;
      }
      var separatorCells = lineIndex + 1 < lines.length ? tableCells(lines[lineIndex + 1]) : [];
      if (line.includes('|') && separatorCells.length > 1 && separatorCells.every(function (cell) {
        return /^:?-{3,}:?$/.test(cell);
      })) {
        flushParagraph(); closeList();
        var headers = tableCells(line);
        html.push('<table><thead><tr>' + headers.map(function (cell) {
          return '<th>' + markdownInline(cell) + '</th>';
        }).join('') + '</tr></thead><tbody>');
        lineIndex += 2;
        while (lineIndex < lines.length && lines[lineIndex].trim() && lines[lineIndex].includes('|')) {
          html.push('<tr>' + tableCells(lines[lineIndex]).map(function (cell) {
            return '<td>' + markdownInline(cell) + '</td>';
          }).join('') + '</tr>');
          lineIndex++;
        }
        html.push('</tbody></table>');
        lineIndex--;
        continue;
      }
      if (!line.trim()) { flushParagraph(); closeList(); continue; }
      if ((m = /^(#{1,6})\s+(.+)$/.exec(line))) {
        flushParagraph(); closeList();
        html.push('<h' + m[1].length + '>' + markdownInline(m[2]) + '</h' + m[1].length + '>');
      } else if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
        flushParagraph(); closeList(); html.push('<hr>');
      } else if ((m = /^>\s?(.*)$/.exec(line))) {
        flushParagraph(); closeList(); html.push('<blockquote><p>' + markdownInline(m[1]) + '</p></blockquote>');
      } else if ((m = /^\s*[-*+]\s+(.+)$/.exec(line))) {
        flushParagraph();
        if (list !== 'ul') { closeList(); html.push('<ul>'); list = 'ul'; }
        html.push('<li>' + markdownInline(m[1]) + '</li>');
      } else if ((m = /^\s*\d+[.)]\s+(.+)$/.exec(line))) {
        flushParagraph();
        if (list !== 'ol') { closeList(); html.push('<ol>'); list = 'ol'; }
        html.push('<li>' + markdownInline(m[1]) + '</li>');
      } else {
        closeList(); paragraph.push(line.trim());
      }
    }
    if (fenced) html.push('<pre><code>' + esc(fence.join('\n')) + '</code></pre>');
    flushParagraph(); closeList();
    return html.join('');
  }

  async function showReadme() {
    closeMenu();
    busy(true);
    try {
      const res = await fetch('/api/readme');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const raw = await res.text();
      let mdText = raw;
      try {
        const parsed = JSON.parse(raw);
        if (parsed.text) mdText = parsed.text;
      } catch {}
      const screen = $('#readme-screen');
      const content = $('#readme-content');
      content.innerHTML = renderMarkdown(mdText);
      $('.view.active')?.classList.remove('active');
      screen.style.display = 'block';
      screen.scrollTop = 0;
      document.title = 'Pi Bay - README.md';
      setActiveTab('');
    } catch (e) {
      toast('Could not open README.md: ' + e.message, 'bad');
    } finally {
      busy(false);
    }
  }

  function showAbout() {
    closeMenu();
    showDialog({
      title: 'About Pi Bay',
      messageHTML: 'An App and MCP Server for managing Raspberry Pis and other SSH devices on a LAN: find them, browse and edit their files, and run commands in an SSH terminal.<br><br>' +
        '<strong>Version:</strong> {{VERSION}}<br>' +
        '<strong>Author:</strong> ctrlPi<br>' +
        '<strong>License:</strong> MIT<br><br>' +
        '<a href="https://www.ctrlpi.com" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none">' +
          '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="8" cy="8" r="6.25"/><path d="M1.75 8h12.5M8 1.75c1.7 1.7 2.6 3.9 2.6 6.25S9.7 12.55 8 14.25C6.3 12.55 5.4 10.35 5.4 8S6.3 3.45 8 1.75Z"/></svg>' +
          'www.ctrlPi.com</a>',
      footerHTML: '<strong>Contact:</strong> <a href="mailto:info@ctrlpi.com">info@ctrlpi.com</a>',
      confirmText: 'Close',
      cancel: false
    });
  }

  // ── Terminal Implementation ──
  // The rows and columns that fit the terminal's pane (its padding and scrollbar left out).
  function terminalSize() {
    if (!term || !term.element || !term.element.parentElement) return;
    const core = term._core;
    const dims = core._renderService?.dimensions;
    if (!dims || !dims.css.cell.width || !dims.css.cell.height) return;
    const parent = term.element.parentElement;
    const parentStyle = window.getComputedStyle(parent);
    const elStyle = window.getComputedStyle(term.element);
    const parentPaddingY = (parseFloat(parentStyle.paddingTop) || 0) + (parseFloat(parentStyle.paddingBottom) || 0);
    const parentPaddingX = (parseFloat(parentStyle.paddingLeft) || 0) + (parseFloat(parentStyle.paddingRight) || 0);
    const elPaddingY = (parseFloat(elStyle.paddingTop) || 0) + (parseFloat(elStyle.paddingBottom) || 0);
    const elPaddingX = (parseFloat(elStyle.paddingLeft) || 0) + (parseFloat(elStyle.paddingRight) || 0);
    const scrollbarWidth = term.options.scrollback === 0 ? 0 : (core.viewport?.scrollBarWidth || 0);
    const availableHeight = parent.clientHeight - parentPaddingY - elPaddingY;
    const availableWidth = parent.clientWidth - parentPaddingX - elPaddingX - scrollbarWidth;
    if (availableHeight <= 0 || availableWidth <= 0) return;
    return {
      cols: Math.max(2, Math.floor(availableWidth / dims.css.cell.width)),
      rows: Math.max(1, Math.floor(availableHeight / dims.css.cell.height))
    };
  }
  // Resizes the terminal to its pane when the size changed.
  function fitTerminal() {
    const size = terminalSize();
    if (!size || (size.cols === term.cols && size.rows === term.rows)) return;
    term._core._renderService.clear();
    term.resize(size.cols, size.rows);
  }

  function openTerminal() {
    if (terminalToken === token && socket && socket.readyState <= 1) {
      setTimeout(fitTerminal, 0);
      return;
    }
    if (socket) {
      socket.onclose = null;
      socket.onerror = null;
      socket.close();
      socket = null;
    }
    const isDark = document.documentElement.classList.contains('dark-mode');
    if (!term) {
      term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
        theme: isDark
          ? { background: '#0d1117', foreground: '#e6edf3', cursor: '#58a6ff', selectionBackground: '#1f6feb44' }
          : { background: '#ffffff', foreground: '#1f2328', cursor: '#0969da', selectionBackground: '#b6e3ff' }
      });
      term.open($('#terminal'));
      term.onData(data => socket?.readyState === 1 && socket.send(JSON.stringify({ type: 'data', data })));
      term.onResize(x => socket?.readyState === 1 && socket.send(JSON.stringify({ type: 'resize', cols: x.cols, rows: x.rows })));

      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          if ($('#workspace').classList.contains('terminal-mode')) {
            fitTerminal();
          }
        });
        ro.observe($('#terminal'));
      }
    }
    term.reset();
    terminalToken = token;
    setTimeout(fitTerminal, 50);

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(proto + '//' + location.host + '/terminal?session=' + encodeURIComponent(token));
    socket.binaryType = 'arraybuffer';
    socket.onmessage = e => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
    socket.onopen = () => {
      fitTerminal();
      if (socket.readyState === 1 && term) {
        socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
      term.focus();
    };
    socket.onerror = () => term.write('\r\n\x1b[31m[terminal connection failed]\x1b[0m\r\n');
    socket.onclose = () => term.write('\r\n\x1b[90m[terminal disconnected]\x1b[0m\r\n');
  }

  // ── Sidebar Resizing (Dragbar) ──
  (function () {
    const dragbar = $('#dragbar');
    const sidebar = $('#sidebar');
    let isDragging = false;
    const savedWidth = localStorage.getItem('pibay-sidebar-w');
    if (savedWidth) sidebar.style.width = savedWidth + 'px';

    dragbar.addEventListener('mousedown', e => {
      e.preventDefault();
      isDragging = true;
      dragbar.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const w = Math.max(180, Math.min(600, e.clientX));
      sidebar.style.width = w + 'px';
      localStorage.setItem('pibay-sidebar-w', w);
      if (term && $('#workspace').classList.contains('terminal-mode')) fitTerminal();
    });
    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      dragbar.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();

  // ── Event Bindings ──
  $('#rows').onclick = e => {
    const tr = e.target.closest('tr[data-i]');
    if (tr) {
      const d = devices[+tr.dataset.i];
      if (d.ssh) askLogin(d);
    }
  };

  $('#pills').onclick = e => {
    const p = e.target.closest('[data-host]');
    if (p) {
      const d = devices.find(x => x.host === p.dataset.host);
      if (!d) return;
      if (chosen && chosen.host === d.host && $('#termButton')?.classList.contains('tab-active')) {
        term?.focus();
        return;
      }
      askLogin(d);
    }
  };

  window.onresize = () => {
    if (term && $('#workspace').classList.contains('terminal-mode')) fitTerminal();
  };

  // Start initial network scan & fetch MCP status
  clearViewer();
  json('/api/mcp').then(d => setMcpEnabled(d.enabled)).catch(() => {});
  scan();
</script>
